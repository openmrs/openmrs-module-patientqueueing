name: Build with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    uses: openmrs/openmrs-contrib-gha-workflows/.github/workflows/build-backend-module.yml@main
    # Platform 1.12.0 and compiler target 1.7 cannot be auto-inferred to an
    # installable JDK (Temurin no longer ships Java 7), so pin JDK 8, which
    # can still compile -source/-target 1.7
    with:
      java_versions: '[8]'
      main_java_version: '8'
    secrets:
      MAVEN_REPO_USERNAME: ${{ secrets.MAVEN_REPO_USERNAME }}
      MAVEN_REPO_API_KEY: ${{ secrets.MAVEN_REPO_API_KEY }}

  owasp-dependency-check:
    if: ${{ github.event_name != 'pull_request' }}
    uses: openmrs/openmrs-contrib-gha-workflows/.github/workflows/owasp-dependency-check.yml@main
    with:
      java_version: '8'
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      BOT_GH_TOKEN: ${{ secrets.OMRS_BOT_GH_TOKEN }}
